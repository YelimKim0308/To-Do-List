<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 16px;
      background: #e8efe7;
      color: #283e31;
      font-family: "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }

    /* 초록색 제본선이 있는 노트 */
    .notebook {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px clamp(18px, 5vw, 40px) 48px;
      background: #fffef7;
      border-left: 10px solid #55775d;
      border-radius: 6px 18px 18px 6px;
      box-shadow: 0 8px 24px #314b3820;
    }

    #title {
      margin: 0;
      font-size: 30px;
    }

    #message {
      margin: 4px 0 24px;
      color: #586b5b;
    }

    .input-row,
    #todoList li {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #todoInput {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #aebfaf;
      border-radius: 8px;
      background: white;
    }

    .add-button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #396447;
      color: white;
    }

    #todoCount {
      margin: 12px 0 20px;
      color: #47644e;
      font-size: 14px;
    }

    /* 할 일 한 줄마다 노트의 가로줄 표시 */
    #todoList {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 2px solid #aebfaf;
    }

    #todoList li {
      padding: 6px 0;
      border-bottom: 1px solid #d4dfd1;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .todo-text::before {
      content: "○";
      margin-right: 8px;
      color: #53765b;
    }

    .completed .todo-text::before {
      content: "✓";
    }

    /* 완료하면 할 일 글자에만 취소선 표시 */
    .completed .todo-text span {
      color: #607264;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 6px 12px;
      border: 1px solid #c5d3c4;
      border-radius: 6px;
      background: #f2f6ed;
      color: #405d47;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #53835d;
      outline-offset: 2px;
    }

    /* 버튼 위에 표시하는 도움말 */
    button[data-help] {
      position: relative;
    }

    button[data-help]::after {
      content: attr(data-help);
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 5px);
      z-index: 2;
      padding: 5px 9px;
      border-radius: 6px;
      background: #304d39;
      color: #fffef7;
      font-size: 13px;
      line-height: 1.5;
      white-space: nowrap;
      pointer-events: none;
    }

    .todo-text[data-help]::after {
      right: auto;
      left: 0;
    }

    /* Tab 키로 버튼을 선택했을 때 */
    button[data-help]:focus-visible::after {
      display: block;
    }

    /* 마우스를 버튼 위에 올렸을 때 */
    @media (hover: hover) {
      button[data-help]:hover::after {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="notebook">
    <h1 id="title">오늘의 할 일</h1>
    <p id="message">할 일을 관리해 보세요.</p>

    <div class="input-row">
      <input
        id="todoInput"
        type="text"
        aria-label="할 일"
        placeholder="할 일을 입력하세요"
      >
      <button
        type="button"
        class="add-button"
        data-help="입력한 할 일 추가"
        onclick="addTodo()"
      >추가</button>
    </div>

    <p id="todoCount" aria-live="polite"></p>

    <ul id="todoList">
      <li>JavaScript 공부하기</li>
      <li>과제 제출하기</li>
    </ul>
  </main>

  <script>
    let todoList = document.querySelector("#todoList");
    let todoCount = document.querySelector("#todoCount");

    // 1. 현재 목록을 기준으로 전체 개수와 완료 개수 표시
    function updateCount() {
      let total = todoList.querySelectorAll("li").length;
      let completed = todoList.querySelectorAll("li.completed").length;

      todoCount.textContent = `전체 ${total}개 / 완료 ${completed}개`;
    }

    // 2. 할 일 한 줄에 완료 버튼과 삭제 버튼 만들기
    function setupTodo(item, text) {
      let textButton = document.createElement("button");
      textButton.type = "button";
      textButton.classList.add("todo-text");
      textButton.dataset.help = "클릭하면 완료";
      textButton.setAttribute("aria-pressed", "false");

      let label = document.createElement("span");
      label.textContent = text;
      textButton.append(label);

      textButton.onclick = function () {
        let isCompleted = item.classList.toggle("completed");
        textButton.setAttribute("aria-pressed", isCompleted);

        if (isCompleted) {
          textButton.dataset.help = "클릭하면 완료 취소";
        } else {
          textButton.dataset.help = "클릭하면 완료";
        }

        updateCount();
      };

      let deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.classList.add("delete-button");
      deleteButton.textContent = "삭제";
      deleteButton.dataset.help = "이 할 일 삭제";
      deleteButton.setAttribute("aria-label", text + " 삭제");

      deleteButton.onclick = function () {
        item.remove();
        updateCount();
      };

      // 기존 글자가 중복되지 않도록 비운 뒤 두 버튼 넣기
      item.textContent = "";
      item.append(textButton, deleteButton);
    }

    // 3. 입력한 할 일 추가
    function addTodo() {
      let input = document.querySelector("#todoInput");
      let text = input.value.trim();

      if (text === "") {
        alert("할 일을 입력하세요.");
        input.focus();
        return;
      }

      let newItem = document.createElement("li");
      setupTodo(newItem, text);
      todoList.append(newItem);

      input.value = "";
      updateCount();
      input.focus();
    }

    // 4. HTML에 처음부터 들어 있는 두 항목에도 같은 기능 연결
    for (let item of todoList.querySelectorAll("li")) {
      setupTodo(item, item.textContent);
    }

    updateCount();
  </script>
</body>
</html>
